# backend/compose.yaml - local development dependencies (never used in production)
# No `latest` (SPRING-DEV-04). CI starts the core services for e2e:smoke (SPRING-DEV-10): pin those by digest
# in the project (`postgres:18@sha256:…`, SEC-CI-02); the update automation keeps tags and digests current (TS-TOOL-15).
name: orders-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2   # set to the production broker version (SPRING-DEV-05); apache/kafka has no major-only tags
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    profiles: [tools]
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:8085:8080"

  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"                          # same port inside and outside, so the issuer URL is identical (SPRING-DEV-11)
      KC_HOSTNAME: http://keycloak.localhost:8180   # issuer seen by the browser, the app on the host and other containers
      KC_HEALTH_ENABLED: "true"                     # /health/ready on the management port 9000 (SPRING-DEV-12)
    networks:
      default:
        aliases:
          - keycloak.localhost                      # other containers (compose.app.yaml) reach the same issuer URL
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro # realm template: dev/keycloak/orders-realm.json (SPRING-DEV-12)
    ports:
      - "127.0.0.1:8180:8180"
    healthcheck:                                    # the image has no curl: plain bash /dev/tcp against the management port
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60                                   # realm import on first start takes a while
      start_period: 10s

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  otel-lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  postgres-data:
