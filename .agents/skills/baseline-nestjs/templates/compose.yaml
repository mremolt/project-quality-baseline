# Local services only (NEST-DEV); images pinned. Start: docker compose up -d
name: orders
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-local-only
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders']
      interval: 2s
      retries: 30
