# Local services only (NEST-DEV); images pinned. Start: docker compose up -d --wait; reset: docker compose down -v
name: orders
services:
  postgres:
    image: postgres:18.1 # Debian-based like production (NEST-DB-01)
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres # superuser for the init script only; the app uses the roles of init.sql (NEST-DEV-04)
      POSTGRES_PASSWORD: postgres
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql # PostgreSQL 18 keeps PGDATA in a versioned subfolder
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orders']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
